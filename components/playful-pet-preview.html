<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playful Pet preview</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #111; color: #fff; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #root { height: 100%; }
  .page { height: 100%; min-height: 420px; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px; max-width: 1200px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; font-size: 13px; color: #9a9a9a; min-height: 1.4em; }
  .stage { position: relative; flex: 1; min-height: 300px; border-radius: 12px; background: linear-gradient(45deg, #f9a8dc 0%, #f253c0 45%, #ee32b4 100%); }
  .tabs { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 0 12px; }
  .tabs button { appearance: none; border: 0; margin: 0; padding: 9px 16px; background: #fdf0f7; color: #111; font: 700 12px/1 ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
  .tabs button.on { background: #222; color: #fff; }
  .tabs button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
